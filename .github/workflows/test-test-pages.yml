# Put this in: danielkryska/test-test → .github/workflows/pages.yml
#
# This deploys whatever is on the gh-pages branch (pushed from white-page).
# Alternative: skip this file entirely and just set Pages → Source → gh-pages branch in repo settings.

name: Deploy to Pages

on:
  push:
    branches: [gh-pages]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
